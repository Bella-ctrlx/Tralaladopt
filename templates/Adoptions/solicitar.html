<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Solicitar adopción | Tralaladopt
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="page-adoption-form">

<main class="contenedor">

    <h1>Solicitud de adopción</h1>

    <div class="animal">
        <strong>{{ animal.nombre }}</strong>

        <p>
            {{ animal.especie }}

            {% if animal.raza %}
                · {{ animal.raza }}
            {% endif %}
        </p>
    </div>

    <form method="POST">

        <div class="campo">

            <label>
                ¿Por qué deseas adoptar a
                {{ animal.nombre }}?
            </label>

            <textarea
                name="motivacion"
                required
            ></textarea>

        </div>

        <div class="campo">

            <label>
                Tipo de vivienda
            </label>

            <select
                name="tipo_vivienda"
                required
            >
                <option value="">
                    Seleccionar
                </option>

                <option value="Casa">
                    Casa
                </option>

                <option value="Apartamento">
                    Apartamento
                </option>

                <option value="Finca">
                    Finca
                </option>

                <option value="Otro">
                    Otro
                </option>
            </select>

        </div>

        <div class="campo">

            <label>
                ¿Tienes otras mascotas?
            </label>

            <select
                name="otras_mascotas"
                required
            >
                <option value="no">
                    No
                </option>

                <option value="si">
                    Sí
                </option>
            </select>

        </div>

        <div class="campo">

            <label>
                Experiencia con mascotas
            </label>

            <textarea
                name="experiencia"
            ></textarea>

        </div>

        <div class="campo">

            <label>
                Tiempo disponible para la mascota
            </label>

            <input
                type="text"
                name="tiempo_disponible"
                placeholder="Ej: 4 horas al día"
            >

        </div>

        <div class="campo">

            <label>
                Información adicional
            </label>

            <textarea
                name="informacion_adicional"
            ></textarea>

        </div>

        <div class="acciones">

            <button type="submit">
                Enviar solicitud
            </button>

            <a
                class="btn secundario"
                href="{{ url_for(
                    'detalle_animal',
                    animal_id=animal.id
                ) }}"
            >
                Cancelar
            </a>

        </div>

    </form>

</main>

</body>
</html>
