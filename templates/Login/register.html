<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Adoptante | Tralaladopt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-auth page-register">

    <div class="container">
        <p class="eyebrow">TRALALADOPT</p>
        <h2>Crear cuenta de adoptante</h2>
        <p class="auth-intro">Esta cuenta te permite adoptar, guardar favoritos y donar a fundaciones.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('registro') }}">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <input type="hidden" name="role" value="adoptante">

            <button type="submit">Registrarme como adoptante</button>
        </form>

        <div class="auth-links">
            <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
            <p>¿Eres una fundación? <a href="{{ url_for('fundaciones.registro') }}">Usa el formulario de fundaciones</a></p>
        </div>
    </div>

</body>
</html>
