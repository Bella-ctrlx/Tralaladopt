<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Solicitud existente | Tralaladopt
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="page-adoption-existing">

<div class="contenedor">

    <h1>
        Ya tienes una solicitud
    </h1>

    <p>
        Ya existe una solicitud activa para
        <strong>{{ animal.nombre }}</strong>.
    </p>

    <span class="estado estado-{{ solicitud.estado }}">
        Estado:
        {{
            solicitud.estado
            |replace("_", " ")
            |capitalize
        }}
    </span>

    <br>

    <a
        class="btn"
        href="{{ url_for('mis_solicitudes') }}"
    >
        Ver mis solicitudes
    </a>

</div>

</body>
</html>
