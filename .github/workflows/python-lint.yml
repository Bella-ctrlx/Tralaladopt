name: Python Code Quality (Ruff)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ejecutar verificación de código con Ruff
        run: |
          ruff check .