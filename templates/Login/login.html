<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Tralaladopt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-auth page-login">

    <div class="container">
        <p class="eyebrow">TRALALADOPT</p>
        <h2>Iniciar Sesión</h2>
        <p class="auth-intro">Ingresa con el correo de tu cuenta.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <div class="auth-links">
            <p>
                ¿Quieres adoptar?
                <a href="{{ url_for('registro') }}">Crear cuenta de adoptante</a>
            </p>
            <p>
                ¿Representas una fundación?
                <a href="{{ url_for('fundaciones.registro') }}">Solicitar registro de fundación</a>
            </p>
        </div>
    </div>

</body>
</html>
