<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Solicitar adopción | Tralaladopt
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .contenedor {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .animal {
            background: #f7f7f7;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .acciones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .btn {
            border: 0;
            background: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .secundario {
            background: #666;
        }
    </style>
</head>

<body>

<main class="contenedor">

    <h1>Solicitud de adopción</h1>

    <div class="animal">
        <strong>{{ animal.nombre }}</strong>

        <p>
            {{ animal.especie }}

            {% if animal.raza %}
                · {{ animal.raza }}
            {% endif %}
        </p>
    </div>

    <form method="POST">

        <div class="campo">

            <label>
                ¿Por qué deseas adoptar a
                {{ animal.nombre }}?
            </label>

            <textarea
                name="motivacion"
                required
            ></textarea>

        </div>

        <div class="campo">

            <label>
                Tipo de vivienda
            </label>

            <select
                name="tipo_vivienda"
                required
            >
                <option value="">
                    Seleccionar
                </option>

                <option value="Casa">
                    Casa
                </option>

                <option value="Apartamento">
                    Apartamento
                </option>

                <option value="Finca">
                    Finca
                </option>

                <option value="Otro">
                    Otro
                </option>
            </select>

        </div>

        <div class="campo">

            <label>
                ¿Tienes otras mascotas?
            </label>

            <select
                name="otras_mascotas"
                required
            >
                <option value="no">
                    No
                </option>

                <option value="si">
                    Sí
                </option>
            </select>

        </div>

        <div class="campo">

            <label>
                Experiencia con mascotas
            </label>

            <textarea
                name="experiencia"
            ></textarea>

        </div>

        <div class="campo">

            <label>
                Tiempo disponible para la mascota
            </label>

            <input
                type="text"
                name="tiempo_disponible"
                placeholder="Ej: 4 horas al día"
            >

        </div>

        <div class="campo">

            <label>
                Información adicional
            </label>

            <textarea
                name="informacion_adicional"
            ></textarea>

        </div>

        <div class="acciones">

            <button type="submit">
                Enviar solicitud
            </button>

            <a
                class="btn secundario"
                href="{{ url_for(
                    'detalle_animal',
                    animal_id=animal.id
                ) }}"
            >
                Cancelar
            </a>

        </div>

    </form>

</main>

</body>
</html>
